<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اختبار اتصال JSONBin</title>
<style>
    body { font-family: sans-serif; background:#011e17; color:#fef3c7; padding:20px; line-height:1.8; }
    pre { background:#000; color:#0f0; padding:15px; border-radius:8px; white-space:pre-wrap; word-break:break-all; }
    h2 { color:#facc15; }
    .box { background:#064e3b; padding:15px; border-radius:10px; margin-bottom:15px; }
</style>
</head>
<body>
    <h2>🔍 اختبار الاتصال بـ JSONBin</h2>
    <div class="box">
        <strong>Bin ID المستخدم:</strong> <span id="binIdShown"></span>
    </div>
    <div id="results">جاري الاختبار...</div>

<script>
    const JSONBIN_ID = "6ab03671ac6210605ae38c1a";
    const JSONBIN_SECRET_KEY = "$2a$10$iySCHqk3quyupnb7QqHeA.NvGFdmyPUA7ZTzZ7/LOKUe0WdRpdVCW";

    document.getElementById('binIdShown').innerText = JSONBIN_ID;

    async function testRead() {
        const box = document.getElementById('results');
        box.innerHTML = "<h3>1) اختبار القراءة (GET) من الـ Bin:</h3><pre id='readResult'>جاري التنفيذ...</pre>";
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_SECRET_KEY }
            });
            const text = await response.text();
            document.getElementById('readResult').innerText =
                "HTTP Status: " + response.status + " (" + (response.ok ? "نجح ✅" : "فشل ❌") + ")\n\n" + text;
        } catch (err) {
            document.getElementById('readResult').innerText = "خطأ شبكة/CORS قبل ما يوصل السيرفر:\n" + err.toString();
        }

        box.innerHTML += "<h3>2) اختبار الكتابة (PUT) على الـ Bin:</h3><pre id='writeResult'>جاري التنفيذ...</pre>";
        try {
            const response2 = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_SECRET_KEY },
                body: JSON.stringify({ test: "connection check", time: new Date().toISOString() })
            });
            const text2 = await response2.text();
            document.getElementById('writeResult').innerText =
                "HTTP Status: " + response2.status + " (" + (response2.ok ? "نجح ✅" : "فشل ❌") + ")\n\n" + text2;
        } catch (err) {
            document.getElementById('writeResult').innerText = "خطأ شبكة/CORS قبل ما يوصل السيرفر:\n" + err.toString();
        }
    }

    testRead();
</script>
</body>
</html>
